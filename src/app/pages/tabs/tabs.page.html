<ion-tabs>
  <ion-tab-bar slot="bottom" class="hd-tab-bar">
    <ion-tab-button tab="home" (click)="goHome()">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    <ion-tab-button (click)="goAttendance()">
      <ion-icon name="clipboard-outline"></ion-icon>
      <ion-label>Attendance</ion-label>
    </ion-tab-button>
    <ion-tab-button (click)="comingSoon('Notices')">
      <ion-icon name="megaphone-outline"></ion-icon>
      <ion-label>Notices</ion-label>
    </ion-tab-button>
    <ion-tab-button (click)="comingSoon('Profile')">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
