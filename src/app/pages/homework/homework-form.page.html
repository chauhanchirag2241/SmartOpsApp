<app-header [title]="pageTitle" [showBack]="true" backHref="/homework" />

<ion-content class="so-page form-page">
  @if (loading) {
    <div class="loading-wrap"><ion-spinner></ion-spinner></div>
  } @else {
    <form class="hw-form" (ngSubmit)="save()">
      <label>Class <span class="req">*</span></label>
      <so-select
        [options]="classOptions"
        placeholder="Select class"
        searchPlaceholder="Search class"
        ariaLabel="Class"
        [(ngModel)]="form.classId"
        name="classId"
      />

      <label>Subject <span class="req">*</span></label>
      <so-select
        [options]="subjectOptions"
        placeholder="Select subject"
        searchPlaceholder="Search subject"
        ariaLabel="Subject"
        [(ngModel)]="form.subjectId"
        name="subjectId"
      />

      <label>Title <span class="req">*</span></label>
      <input class="so-filter-select" [(ngModel)]="form.title" name="title" required />

      <label>Description</label>
      <textarea class="so-filter-select textarea" [(ngModel)]="form.description" name="description" rows="3"></textarea>

      <div class="two-col">
        <div>
          <label>Assign date</label>
          <so-date-input [(ngModel)]="form.assignDate" name="assignDate" placeholder="Assign date" ariaLabel="Assign date" />
        </div>
        <div>
          <label>Due date <span class="req">*</span></label>
          <so-date-input [(ngModel)]="form.dueDate" name="dueDate" placeholder="Due date" ariaLabel="Due date" />
        </div>
      </div>

      <label>Priority</label>
      <select class="so-filter-select" [(ngModel)]="form.priority" name="priority">
        <option [ngValue]="HomeworkPriority.Normal">Normal</option>
        <option [ngValue]="HomeworkPriority.High">High</option>
        <option [ngValue]="HomeworkPriority.Low">Low</option>
      </select>

      <label>Marks (optional)</label>
      <input class="so-filter-select" type="number" min="0" [(ngModel)]="form.marks" name="marks" />

      <label>Submission type</label>
      <select class="so-filter-select" [(ngModel)]="form.submissionType" name="submissionType">
        <option [ngValue]="HomeworkSubmissionType.Physical">Physical (in class)</option>
        <option [ngValue]="HomeworkSubmissionType.Online">Online</option>
        <option [ngValue]="HomeworkSubmissionType.Both">Both</option>
      </select>

      <button type="submit" class="save-btn" [disabled]="saving || !canManage">
        @if (saving) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <so-icon [name]="saveIcon"></so-icon>
          {{ homeworkId ? 'Save changes' : 'Assign homework' }}
        }
      </button>
    </form>
  }
</ion-content>
