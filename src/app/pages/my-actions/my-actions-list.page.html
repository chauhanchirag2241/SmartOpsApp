<app-header [title]="'My Actions'" [showBack]="true" backHref="/tabs/home" />

<ion-content class="so-page my-actions-page">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content />
  </ion-refresher>

  <main class="actions-body">
    <div class="section-head">
      <p class="section-label">Pending</p>
      <p class="section-sub">
        @if (pendingCount === 1) {
          1 item waiting for your response
        } @else {
          {{ pendingCount }} items waiting for your response
        }
      </p>
    </div>

    @if (loading) {
      <div class="loading-wrap"><ion-spinner name="crescent"></ion-spinner></div>
    } @else if (!items.length) {
      <div class="empty-card">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
        <h3>All caught up</h3>
        <p>No pending actions right now.</p>
      </div>
    } @else {
      <div class="card-list">
        @for (item of items; track item.id) {
          <button type="button" class="action-card" (click)="open(item.id)">
            <div class="action-icon" [class]="typeClass(item)" aria-hidden="true">
              <ion-icon [name]="typeIcon(item)"></ion-icon>
            </div>
            <div class="action-main">
              <span class="type-label">{{ item.itemTypeLabel }}</span>
              <strong class="action-title">{{ item.title }}</strong>
              @if (item.summary) {
                <p class="action-summary">{{ item.summary }}</p>
              }
            </div>
            <ion-icon class="chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
          </button>
        }
      </div>
    }
  </main>
</ion-content>
