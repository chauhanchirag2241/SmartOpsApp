<ion-content class="login-page" [fullscreen]="true">
  <div class="login-wrap">
    <div class="brand">
      <h1>SmartOps</h1>
      <p>School portal — sign in with your account</p>
    </div>

    @if (sessionExpired) {
      <ion-note color="warning" class="session-note">Session expired. Please sign in again.</ion-note>
    }

    <div class="login-form">
      <div class="field-group">
        <label class="field-label" for="loginId">Mobile number or email</label>
        <div class="field-input">
          <ion-input
            id="loginId"
            type="text"
            inputmode="email"
            [(ngModel)]="loginId"
            autocomplete="username"
          ></ion-input>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label" for="loginPassword">Password</label>
        <div class="field-input">
          <ion-input
            id="loginPassword"
            type="password"
            [(ngModel)]="password"
            autocomplete="current-password"
          ></ion-input>
        </div>
      </div>
    </div>

    <ion-button expand="block" class="so-btn-primary login-btn" [disabled]="loading" (click)="login()">
      @if (loading) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Sign in
      }
    </ion-button>

    <ion-text color="medium" class="hint">
      <p>Teachers: use registered mobile. Admins: use email (e.g. admin@smartops.com). OTP login coming soon.</p>
    </ion-text>
  </div>
</ion-content>
