<ion-content class="login-page" [fullscreen]="true">
  <div class="login-wrap">
    <div class="brand">
      <h1>SmartOps</h1>
      <p>School portal — sign in with your account</p>
    </div>

    @if (sessionExpired) {
      <ion-note color="warning" class="session-note">Session expired. Please sign in again.</ion-note>
    }

    <ion-list class="login-form" lines="none">
      <ion-item>
        <ion-label position="stacked">Mobile number or email</ion-label>
        <ion-input
          type="text"
          inputmode="email"
          [(ngModel)]="loginId"
          autocomplete="username"
          placeholder="9876543210 or admin@school.com"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Password</ion-label>
        <ion-input type="password" [(ngModel)]="password" autocomplete="current-password"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" class="so-btn-primary login-btn" [disabled]="loading" (click)="login()">
      @if (loading) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Sign in
      }
    </ion-button>

    <ion-text color="medium" class="hint">
      <p>Teachers: use registered mobile. Admins: use email (e.g. admin@smartops.com). OTP login coming soon.</p>
    </ion-text>
  </div>
</ion-content>
