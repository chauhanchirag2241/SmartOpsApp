<app-header
  title="Students"
  [showBack]="true"
  [showFilter]="true"
  backHref="/tabs/home"
  searchPlaceholder="Search name, roll, admission..."
/>

<ion-content class="so-page students-page">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <so-module-shell>
    <div class="active-filters-bar">
      <span>{{ classFilterLabel }}</span>
      <span>{{ statusFilterLabel }}</span>
    </div>

    <so-page-toolbar [totalCount]="totalCount" totalLabel="Students"></so-page-toolbar>

    @if (loading) {
      <div class="loading-wrap"><ion-spinner></ion-spinner></div>
    } @else if (!students.length) {
      <div class="so-empty">
        <ion-icon name="people-outline"></ion-icon>
        <h3>No students found</h3>
        <p>Adjust search or filters.</p>
      </div>
    } @else {
      <div class="student-cards">
        @for (s of students; track s.id) {
          <button type="button" class="student-card" (click)="openStudent(s)">
            <so-avatar [name]="s.name" [seed]="s.name" size="md" shape="rounded" />
            <div class="card-main">
              <strong>{{ s.name }}</strong>
              <p class="class-roll">
                @if (s.rollNumber) {
                  <span>Roll #{{ s.rollNumber }}</span>
                }
                @if (s.class) {
                  <span>{{ s.class }}</span>
                }
              </p>
              @if (s.admNo) {
                <p class="admission-line">Admission: {{ s.admNo }}</p>
              }
            </div>
            <div class="card-end">
              <span class="status-pill" [class]="statusClass(s)">{{ statusLabel(s) }}</span>
              <ion-icon class="chevron" name="chevron-forward-outline"></ion-icon>
            </div>
          </button>
        }
      </div>

      <ion-infinite-scroll [disabled]="!hasMore" (ionInfinite)="onInfinite($event)">
        <ion-infinite-scroll-content loadingSpinner="crescent"></ion-infinite-scroll-content>
      </ion-infinite-scroll>
    }
  </so-module-shell>
</ion-content>

<so-filter-popover
  [isOpen]="filterOpen"
  [initialBreakpoint]="0.52"
  (closed)="filterOpen = false"
  (cleared)="clearFilters()"
  (applied)="applyFilters()"
>
  <div class="filter-field">
    <label>Class</label>
    <so-multi-select
      [options]="classOptions"
      placeholder="All classes"
      searchPlaceholder="Search class"
      ariaLabel="Class"
      [(ngModel)]="classFilterIds"
    />
  </div>
  <div class="filter-field">
    <label>Status</label>
    <div class="filter-chip-group">
      @for (opt of statusOptions; track opt.value) {
        <button
          type="button"
          class="filter-chip-option"
          [class.active]="statusFilter === opt.value"
          (click)="statusFilter = opt.value"
        >
          {{ opt.label }}
        </button>
      }
    </div>
  </div>
</so-filter-popover>
