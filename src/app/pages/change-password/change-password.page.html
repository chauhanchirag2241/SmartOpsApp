<ion-content class="so-auth-page" [fullscreen]="true">
  <div class="so-auth-wrap">
    <div class="so-auth-brand">
      <div class="so-app-title">SmartOps</div>
      <h1>Update password</h1>
      <p>For security, set a new password before continuing</p>
    </div>

    @if (errorMessage) {
      <div class="so-alert danger">{{ errorMessage }}</div>
    }

    <div class="so-card so-auth-card">
      <div class="so-field">
        <label class="so-field-label" for="oldPassword">Current password</label>
        <div class="so-input-wrap">
          <ion-input
            id="oldPassword"
            type="password"
            [(ngModel)]="oldPassword"
            autocomplete="current-password"
          ></ion-input>
        </div>
      </div>
      <div class="so-field">
        <label class="so-field-label" for="newPassword">New password</label>
        <div class="so-input-wrap">
          <ion-input
            id="newPassword"
            type="password"
            [(ngModel)]="newPassword"
            autocomplete="new-password"
          ></ion-input>
        </div>
      </div>
      <div class="so-field">
        <label class="so-field-label" for="confirmNewPassword">Confirm new password</label>
        <div class="so-input-wrap">
          <ion-input
            id="confirmNewPassword"
            type="password"
            [(ngModel)]="confirmNewPassword"
            autocomplete="new-password"
            (keyup.enter)="submit()"
          ></ion-input>
        </div>
      </div>
    </div>

    <div class="so-auth-actions">
      <ion-button expand="block" class="so-btn-primary" [disabled]="loading" (click)="submit()">
        @if (loading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Update password
        }
      </ion-button>
    </div>
  </div>
</ion-content>
