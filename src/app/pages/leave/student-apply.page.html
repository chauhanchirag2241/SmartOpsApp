<app-header title="Student Leave" [showBack]="true" backHref="/home" />
<ion-content class="ion-padding">
  @if (loading || saving) {
    <ion-spinner name="crescent" />
  } @else if (!children.length) {
    <p>No linked students found for your account.</p>
  } @else {
    <label>Student
      <select [(ngModel)]="studentId">
        <option value="">Select student</option>
        @for (c of children; track c.id) {
          <option [value]="c.id">{{ c.name }} @if (c.className) { ({{ c.className }}) }</option>
        }
      </select>
    </label>
    <label>From</label>
    <so-date-input [(ngModel)]="fromDate" placeholder="From date" ariaLabel="From date" />
    <label>To</label>
    <so-date-input [(ngModel)]="toDate" placeholder="To date" ariaLabel="To date" />
    <label>Type
      <select [(ngModel)]="leaveType">
        <option [ngValue]="LeaveType.Casual">Casual</option>
        <option [ngValue]="LeaveType.Sick">Sick</option>
        <option [ngValue]="LeaveType.Other">Other</option>
      </select>
    </label>
    <label>Reason <textarea [(ngModel)]="reason" rows="3"></textarea></label>
    <button type="button" class="primary-btn" [disabled]="!canApply || !studentId" (click)="submit()">
      <so-icon [name]="sendIcon"></so-icon>
      Submit for approval
    </button>
  }
</ion-content>
