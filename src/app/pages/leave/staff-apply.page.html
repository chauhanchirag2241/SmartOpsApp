<app-header title="Staff Leave" [showBack]="true" backHref="/home" />
<ion-content class="ion-padding">
  @if (saving) {
    <ion-spinner name="crescent" />
  } @else {
    <label>From <input type="date" [(ngModel)]="fromDate" /></label>
    <label>To <input type="date" [(ngModel)]="toDate" /></label>
    <label>Type
      <select [(ngModel)]="leaveType">
        <option [ngValue]="LeaveType.Casual">Casual</option>
        <option [ngValue]="LeaveType.Sick">Sick</option>
        <option [ngValue]="LeaveType.Other">Other</option>
      </select>
    </label>
    <label>Reason <textarea [(ngModel)]="reason" rows="3"></textarea></label>
    <button type="button" class="primary-btn" [disabled]="!canApply" (click)="submit()">Submit for approval</button>
  }
</ion-content>
